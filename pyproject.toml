[project]
name = "tldr-optimized"
version = "1.3.0"
description = "Transposable element insertion detection from long-read sequencing data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Adam Ewing" }]
dependencies = [
    "bx-python>=0.8.13",
    "joblib>=1.1.0",
    "numpy>=1.22.0,<2.4",
    "pysam>=0.18.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.8.0",
    "threadpoolctl>=3.1.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.7.0",
    "pandas>=1.5.0",
    "seaborn>=0.12.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Repository = "https://github.com/lifelix1209/tldr_optimized"
Issues = "https://github.com/lifelix1209/tldr_optimized/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
script-files = ["tldr/tldr"]
packages = []
