name: tldr-dev
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Core tools
  - python>=3.13
  - pip>=24.0

  # Bioinformatics tools
  - exonerate>=2.4.0
  - mafft>=7.490
  - minimap2>=2.24
  - samtools>=1.19

  # Python dependencies (from pip section below)
  - pip
  - pip:
    # Core dependencies
    - bx-python>=0.14.0
    - joblib>=1.5.3
    - numpy>=2.4.0
    - pysam>=0.23.3
    - scikit-learn>=1.8.0
    - scipy>=1.16.3
    - threadpoolctl>=3.6.0
    - tqdm>=4.67.1

    # Visualization
    - matplotlib>=3.8.0

    # Development
    - pytest>=8.0.0
