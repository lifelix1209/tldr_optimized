name: tldr-dev
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Core runtime
  - python=3.11
  - pip
  - exonerate=2.4.*
  - mafft=7.*
  - minimap2>=2.24
  - samtools>=1.16
  - tabix

  # Python dependencies
  - pip:
    - bx-python>=0.8.13
    - joblib>=1.1.0
    - numpy>=1.22.0,<2.4
    - pysam>=0.18.0
    - scikit-learn>=1.0.0
    - scipy>=1.8.0
    - threadpoolctl>=3.1.0
    - tqdm>=4.64.0

    # Visualization / analysis
    - matplotlib>=3.7.0
    - pandas>=1.5.0
    - seaborn>=0.12.0

    # Development
    - pytest>=8.0.0
