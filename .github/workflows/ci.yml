name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  python-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        run: |
          python -m py_compile tldr/tldr
          find scripts test test_denovo -name "*.py" -print0 | xargs -0 python -m py_compile
